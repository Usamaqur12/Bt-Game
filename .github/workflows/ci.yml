name: PrimeBet CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_ENABLE_DEMO_BACKEND: "true"
      NEXT_PUBLIC_DEMO_MODE: "true"
      NEXT_PUBLIC_SITE_NAME: PrimeBet
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPPORT_EMAIL: support@example.com

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit UI actions
        run: npm run test:ui-actions

      - name: Production build
        run: npm run build
